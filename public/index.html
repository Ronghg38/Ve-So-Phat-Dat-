<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vé Số Phát Đạt - Trực Tiếp 3 Miền</title>
  <style>
    /* Tổng quan */
    body { margin: 0; font-family: 'Arial', sans-serif; background: #111; color: #333; }
    
    /* Header đỏ vàng chuẩn ảnh */
    header { background: linear-gradient(180deg, #d30000 0%, #8b0000 100%); color: #ffd700; text-align: center; padding: 15px 5px; border-bottom: 3px solid #ffd700; }
    h1 { margin: 0; font-size: 26px; text-transform: uppercase; font-weight: 900; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); letter-spacing: 1px; }
    .subtitle { background: #ffd700; color: #b40000; display: inline-block; padding: 4px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-top: 8px; text-transform: uppercase; }

    /* Tabs 3 Miền */
    .tabs { display: flex; justify-content: center; background: #333; padding: 10px; gap: 5px; }
    .tab-btn { flex: 1; padding: 10px 5px; background: #555; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 13px; }
    .tab-btn.active { background: #d30000; border: 1px solid #ffd700; }

    .container { max-width: 1000px; margin: 10px auto; padding: 0 5px; }
    
    /* Thanh công cụ cập nhật */
    .toolbar { background: #fff; padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 1px solid #ddd; }
    .toolbar-date { font-weight: bold; color: #d30000; font-size: 14px; }
    .btn-update { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; display: flex; align-items: center; gap: 5px; }

    /* Lưới các đài (chia cột như ảnh) */
    .stations-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .station-card { background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    
    /* Màu sắc tiêu đề từng đài (Xanh dương, Xanh lá, Tím) */
    .station-card:nth-child(3n+1) .station-name { background: #1976d2; } 
    .station-card:nth-child(3n+2) .station-name { background: #388e3c; } 
    .station-card:nth-child(3n+3) .station-name { background: #7b1fa2; } 
    
    .station-name { color: white; text-align: center; padding: 10px; font-weight: bold; text-transform: uppercase; font-size: 16px; border-bottom: 2px solid #fff; }

    /* Các hàng giải thưởng */
    .prize-row { display: flex; border-bottom: 1px solid #eee; align-items: center; }
    .prize-row:last-child { border-bottom: none; }
    .prize-label { width: 45px; background: #f4f4f4; text-align: center; font-weight: bold; padding: 10px 5px; color: #555; border-right: 1px solid #eee; font-size: 13px; }
    .prize-nums { flex: 1; text-align: center; padding: 10px 5px; font-weight: bold; font-size: 16px; color: #000; letter-spacing: 2px; line-height: 1.5; }
    
    /* Nổi bật giải 8 và Đặc biệt bằng màu đỏ */
    .highlight-red { color: #d30000; }
    .highlight-db { color: #d30000; font-size: 22px; font-weight: 900; }
    
    #status-msg { text-align: center; color: white; padding: 10px; font-style: italic; }
  </style>
</head>
<body>

<header>
  <h1>VÉ SỐ PHÁT ĐẠT</h1>
  <div class="subtitle">SOI CẦU KẾT QUẢ XỔ SỐ 3 MIỀN</div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchRegion('XSMN')">Miền Nam</button>
  <button class="tab-btn" onclick="switchRegion('XSMT')">Miền Trung</button>
  <button class="tab-btn" onclick="switchRegion('XSMB')">Miền Bắc</button>
</div>

<div class="container">
  <div class="toolbar">
    <div class="toolbar-date" id="date-display">Đang tải ngày...</div>
    <button class="btn-update" onclick="updateData()">🔄 Cập nhật ngay</button>
  </div>
  
  <div id="status-msg"></div>
  <div id="results">
    <!-- Giao diện từng đài sẽ được vẽ vào đây -->
  </div>
</div>

<script>
let currentData = null;

async function loadData() {
  document.getElementById('status-msg').innerHTML = "Đang tải dữ liệu...";
  try {
    const data = await fetch('/api/results').then(r => r.json());
    if(!data || !data.length) {
      document.getElementById('results').innerHTML = '<div style="background:#fff;padding:20px;text-align:center;">Chưa có dữ liệu.</div>';
      return;
    }
    currentData = data[0]; 
    
    let dateText = currentData.updatedAt ? new Date(currentData.updatedAt).toLocaleDateString('vi-VN') : 'Hôm nay';
    document.getElementById('date-display').innerText = 'KẾT QUẢ NGÀY ' + dateText;
    
    renderMienNam(currentData);
    document.getElementById('status-msg').innerHTML = "";
  } catch(e) {
    document.getElementById('status-msg').innerHTML = "Lỗi kết nối máy chủ!";
  }
}

function renderMienNam(dataObj) {
  if(!dataObj || !dataObj.rows || dataObj.rows.length === 0) return;
  
  let rows = dataObj.rows;
  let stations = [];
  for (let i = 1; i < rows[0].length; i++) {
     if(rows[0][i]) stations.push(rows[0][i]);
  }

  let html = '<div class="stations-grid">';
  
  stations.forEach((station, index) => {
    html += '<div class="station-card">';
    html += '<div class="station-name">' + station + '</div>';
    
    for(let i = 1; i < rows.length; i++) {
       let row = rows[i];
       if (row[0] && (row[0].startsWith('G') || row[0].startsWith('Đ') || row[0].startsWith('M'))) {
           let prizeName = row[0];
           let prizeNums = row[index + 1] || ''; 
           
           let numClass = 'prize-nums';
           if (prizeName === 'ĐB' || prizeName === 'Đặc Biệt') numClass += ' highlight-db';
           else if (prizeName === 'G8') numClass += ' highlight-red';
           
           // Cập nhật quan trọng: Xóa khoảng trắng thừa 2 bên, sau đó gom nhiều khoảng trắng ở giữa thành 1 cụm " - "
           let formattedNums = prizeNums.trim().replace(/\s+/g, ' - ');
           
           html += '<div class="prize-row">';
           html += '<div class="prize-label">' + prizeName + '</div>';
           html += '<div class="' + numClass + '">' + formattedNums + '</div>';
           html += '</div>';
       }
    }
    html += '</div>';
  });
  
  html += '</div>';
  document.getElementById('results').innerHTML = html;
}

function switchRegion(region) {
  let btns = document.querySelectorAll('.tab-btn');
  btns.forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  
  if (region === 'XSMN') {
    renderMienNam(currentData);
  } else {
    document.getElementById('results').innerHTML = '<div style="background:#fff;padding:40px;text-align:center;font-weight:bold;border-radius:8px;">Hệ thống đang nâng cấp dữ liệu cho ' + region + '.<br><br>Vui lòng chọn Miền Nam để xem!</div>';
  }
}

async function updateData() {
  document.getElementById('status-msg').innerHTML = 'Hệ thống đang đồng bộ dữ liệu mới...';
  try {
    await fetch('/api/update', {method:'POST'});
    setTimeout(loadData, 2000); 
  } catch(e) {
    alert("Có lỗi khi cập nhật!");
  }
}

loadData();
</script>

</body>
</html>
