<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vé Số Phát Đạt - Soi Cầu XSMN | CẬU TƯ RONG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h2 class="brand-name">CẬU TƯ RONG</h2>
            <h1 class="app-title">VÉ SỐ PHÁT ĐẠT</h1>
            <p class="subtitle">Hệ Thống Phân Tích & Soi Cầu XSMN</p>
        </header>

        <div class="control-panel">
            <div class="input-group">
                <label>Giải Đặc Biệt (GĐB):</label>
                <input type="text" id="gdb" placeholder="VD: 248195" maxlength="6">
            </div>
            <div class="input-group">
                <label>Giải Nhất (G1):</label>
                <input type="text" id="g1" placeholder="VD: 71345" maxlength="5">
            </div>
            <div class="input-group">
                <label>Dãy số bất kỳ (Tìm Cầu Kẹp):</label>
                <input type="text" id="giaiKhac" placeholder="VD: 83482" maxlength="5">
            </div>
            
            <button class="btn-calc" onclick="xuLySoiCau()">PHÂN TÍCH NHỊP LÔ</button>
        </div>

        <div class="result-board">
            <h3>KẾT QUẢ DỰ ĐOÁN</h3>
            <div class="result-item">
                <span>Cầu Pascal:</span>
                <span class="highlight neon-text" id="kqPascal">00</span>
            </div>
            <div class="result-item">
                <span>Bóng Dương (2 số cuối GĐB):</span>
                <span class="highlight neon-text" id="kqBongDuong">00</span>
            </div>
            <div class="result-item">
                <span>Bóng Âm (2 số cuối GĐB):</span>
                <span class="highlight neon-text" id="kqBongAm">00</span>
            </div>
            <div class="result-item">
                <span>Cầu Kẹp:</span>
                <span class="highlight neon-text" id="kqKep">Không có</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
