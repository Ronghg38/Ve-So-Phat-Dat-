<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vé Số Phát Đạt - Soi Cầu XSMN</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f5f5f5;
      color:#222
    }
    header{
      background:linear-gradient(135deg,#b40000,#e00000);
      color:#fff;
      padding:18px 12px;
      text-align:center
    }
    header h1{
      margin:0;
      font-size:24px
    }
    header p{
      margin:6px 0 0;
      font-size:14px
    }
    .tabs{
      display:flex;
      background:#8b0000;
      overflow:hidden
    }
    .tabs button{
      flex:1;
      border:0;
      padding:13px 5px;
      background:#8b0000;
      color:#fff;
      font-weight:bold;
      cursor:pointer
    }
    .tabs button.active{
      background:#ffd700;
      color:#8b0000
    }
    .container{
      max-width:1100px;
      margin:auto;
      padding:12px
    }
    .notice{
      background:#fff8d8;
      border:1px solid #e0c85a;
      border-radius:10px;
      padding:12px;
      margin-bottom:12px;
      font-size:14px
    }
    .control{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:15px
    }
    .control button{
      border:0;
      border-radius:8px;
      padding:12px 16px;
      background:#c40000;
      color:#fff;
      font-weight:bold;
      cursor:pointer
    }
    .control button:active{
      transform:scale(.98)
    }
    #status{
      font-size:13px;
      padding:5px 0
    }
    .section-title{
      background:#c40000;
      color:#fff;
      padding:12px;
      border-radius:8px;
      margin:15px 0 10px;
      font-size:18px;
      font-weight:bold
    }
    .stations{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:12px
    }
    .station{
      background:#fff;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 2px 7px #ccc
    }
    .station h3{
      margin:0;
      padding:12px;
      background:#ffe0e0;
      color:#a00000;
      text-align:center
    }
    table{
      width:100%;
      border-collapse:collapse
    }
    th,td{
      border-bottom:1px solid #eee;
      padding:8px;
      text-align:center;
      font-size:14px
    }
    th{
      background:#fafafa
    }
    .db{
      font-size:24px;
      font-weight:bold;
      color:#c40000
    }
    .analysis{
      background:#fff;
      border-radius:10px;
      padding:14px;
      margin-top:15px;
      box-shadow:0 2px 7px #ddd
    }
    .analysis h3{
      color:#b00000;
      margin-top:0
    }
    .numbers{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:8px
    }
    .num{
      background:#c40000;
      color:#fff;
      padding:5px 9px;
      border-radius:15px;
      font-weight:bold
    }
    .hidden{
      display:none
    }
    footer{
      text-align:center;
      color:#777;
      font-size:12px;
      padding:25px 10px
    }
    @media(max-width:600px){
      header h1{font-size:21px}
      .stations{
        grid-template-columns:1fr
      }
      th,td{
        padding:7px 4px;
        font-size:13px
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎯 VÉ SỐ PHÁT ĐẠT</h1>
  <p>Soi cầu - Thống kê Xổ Số Miền Nam</p>
</header>

<div class="tabs">
  <button id="tab-mn" class="active" onclick="showRegion('mn')">
    MIỀN NAM
  </button>
  <button id="tab-mt" onclick="showRegion('mt')">
    MIỀN TRUNG
  </button>
  <button id="tab-mb" onclick="showRegion('mb')">
    MIỀN BẮC
  </button>
</div>

<div class="container">

  <div class="notice">
    ⚠️ Dữ liệu được tổng hợp tự động từ nguồn kết quả xổ số.
    Nội dung thống kê chỉ mang tính tham khảo, không đảm bảo kết quả.
  </div>

  <div class="control">
    <button onclick="updateData()">🔄 CẬP NHẬT NGAY</button>
    <div id="status">Đang kiểm tra dữ liệu...</div>
  </div>

  <div id="mn" class="region"></div>
  <div id="mt" class="region hidden"></div>
  <div id="mb" class="region hidden"></div>

</div>

<footer>
  © Vé Số Phát Đạt - Soi Cầu XSMN
</footer>

<script>
let currentRegion = "mn";

function showRegion(region){
  currentRegion = region;

  document.querySelectorAll(".region").forEach(el=>{
    el.classList.add("hidden");
  });

  document.getElementById(region).classList.remove("hidden");

  document.querySelectorAll(".tabs button").forEach(btn=>{
    btn.classList.remove("active");
  });

  document.getElementById("tab-"+region).classList.add("active");

  loadRegion(region);
}

async function loadRegion(region){
  const box = document.getElementById(region);
  box.innerHTML = "<div class='analysis'>⏳ Đang tải dữ liệu...</div>";

  try{
    const res = await fetch("/api/results?region="+region);
    const data = await res.json();

    renderRegion(region,data);

  }catch(error){
    box.innerHTML =
      "<div class='analysis'>❌ Không tải được dữ liệu. Hãy bấm CẬP NHẬT NGAY.</div>";
  }
}

function renderRegion(region,data){

  const box = document.getElementById(region);

  let title = "";

  if(region==="mn"){
    title = "KẾT QUẢ XỔ SỐ MIỀN NAM";
  }

  if(region==="mt"){
    title = "KẾT QUẢ XỔ SỐ MIỀN TRUNG";
  }

  if(region==="mb"){
    title = "KẾT QUẢ XỔ SỐ MIỀN BẮC";
  }

  let html =
    "<div class='section-title'>"+title+"</div>";

  if(!data || !data.length){
    html +=
      "<div class='analysis'>Chưa có dữ liệu. Hãy bấm CẬP NHẬT NGAY.</div>";
    box.innerHTML = html;
    return;
  }

  html += "<div class='stations'>";

  data.forEach(station=>{

    html += "<div class='station'>";

    html +=
      "<h3>"+escapeHtml(station.station || "Đài xổ số")+"</h3>";

    html += "<table>";

    if(station.rows && station.rows.length){

      station.rows.forEach(row=>{

        html += "<tr>";

        row.forEach((cell,index)=>{

          const tag = index===0 ? "th" : "td";

          let value = escapeHtml(String(cell));

          if(String(cell).length>=5 && index>0){
            value =
              "<span class='db'>"+value+"</span>";
          }

          html += "<"+tag+">"+value+"</"+tag+">";
        });

        html += "</tr>";
      });

    }else{

      html +=
        "<tr><td>Chưa có kết quả</td></tr>";
    }

    html += "</table>";
    html += "</div>";
  });

  html += "</div>";

  loadAnalysis(region).then(analysis=>{

    html += analysis;

    box.innerHTML = html;

  }).catch(()=>{

    box.innerHTML = html;
  });
}

async function loadAnalysis(region){

  try{

    const res =
      await fetch("/api/analyze?region="+region);

    const data = await res.json();

    let html =
      "<div class='analysis'>";

    html +=
      "<h3>📊 THỐNG KÊ THAM KHẢO</h3>";

    if(data.totalPoint !== undefined){

      html +=
        "<p><b>Cầu tổng:</b> "+
        escapeHtml(String(data.totalPoint))+
        "</p>";
    }

    if(data.heads){

      html += "<p><b>Đầu:</b></p>";
      html += "<div class='numbers'>";

      Object.keys(data.heads)
        .sort((a,b)=>data.heads[b]-data.heads[a])
        .slice(0,10)
        .forEach(n=>{
          html +=
            "<span class='num'>"+
            n+" ("+data.heads[n]+")</span>";
        });

      html += "</div>";
    }

    if(data.tails){

      html += "<p><b>Đuôi:</b></p>";
      html += "<div class='numbers'>";

      Object.keys(data.tails)
        .sort((a,b)=>data.tails[b]-data.tails[a])
        .slice(0,10)
        .forEach(n=>{
          html +=
            "<span class='num'>"+
            n+" ("+data.tails[n]+")</span>";
        });

      html += "</div>";
    }

    if(data.overlap && data.overlap.length){

      html +=
        "<p><b>🔗 Giao thoa liên đài:</b></p>";

      html += "<div class='numbers'>";

      data.overlap.forEach(n=>{

        html +=
          "<span class='num'>"+n+"</span>";
      });

      html += "</div>";
    }

    html += "</div>";

    return html;

  }catch(e){

    return "";
  }
}

async function updateData(){

  const status =
    document.getElementById("status");

  status.innerText =
    "⏳ Đang cập nhật dữ liệu...";

  try{

    const res =
      await fetch("/api/update");

    const data =
      await res.json();

    if(data.success){

      status.innerText =
        "✅ Đã cập nhật dữ liệu thành công.";

      loadRegion(currentRegion);

    }else{

      status.innerText =
        "⚠️ Chưa cập nhật được dữ liệu.";
    }

  }catch(error){

    status.innerText =
      "❌ Lỗi kết nối máy chủ.";
  }
}

function escapeHtml(value){

  return value
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function checkStatus(){

  try{

    const res =
      await fetch("/api/status");

    const data =
      await res.json();

    document.getElementById("status").innerText =
      data.message ||
      "✅ Máy chủ đang hoạt động.";

  }catch(e){

    document.getElementById("status").innerText =
      "⚠️ Đang chờ máy chủ...";
  }
}

checkStatus();
loadRegion("mn");
</script>

</body>
</html>
