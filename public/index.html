<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vé Số Phát Đạt - Soi Cầu XSMN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #b40000, #e00000);
      color: #fff;
      text-align: center;
      padding: 14px 10px;
      box-shadow: 0 2px 8px #999;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 5px;
      padding: 8px;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 1px 5px #bbb;
    }

    .tabs button {
      flex: 1;
      border: 0;
      border-radius: 6px;
      padding: 10px 5px;
      font-weight: bold;
      background: #eee;
      color: #555;
      cursor: pointer;
    }

    .tabs button.active {
      background: #c40000;
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 10px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .title {
      font-weight: bold;
      color: #a90000;
      font-size: 18px;
    }

    .update {
      border: 0;
      background: #c40000;
      color: white;
      border-radius: 6px;
      padding: 9px 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }

    .station {
      background: white;
      border-radius: 9px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 1px 5px #ccc;
    }

    .station-head {
      background: #fff4d6;
      border-bottom: 1px solid #e4c76a;
      padding: 10px 12px;
    }

    .station-name {
      color: #a50000;
      font-size: 18px;
      font-weight: 800;
    }

    .station-date {
      color: #666;
      font-size: 13px;
      margin-top: 3px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      border-bottom: 1px solid #eee;
      padding: 8px 7px;
      vertical-align: top;
    }

    td:first-child {
      width: 42px;
      text-align: center;
      font-weight: bold;
      color: #a00000;
      background: #fafafa;
    }

    td:last-child {
      font-weight: 600;
      word-break: break-word;
      line-height: 1.5;
    }

    .special td {
      background: #fff1b8;
      color: #c00000;
      font-size: 18px;
      font-weight: 800;
    }

    .view {
      display: block;
      width: calc(100% - 20px);
      margin: 10px;
      border: 0;
      background: #b40000;
      color: #fff;
      border-radius: 6px;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .detail {
      display: none;
    }

    .back {
      border: 0;
      background: #555;
      color: #fff;
      padding: 9px 14px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .detail-title {
      background: #fff4d6;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #e4c76a;
    }

    .detail-title h2 {
      margin: 0;
      color: #a50000;
      font-size: 20px;
    }

    .detail-title p {
      margin: 5px 0 0;
      color: #666;
      font-size: 13px;
    }

    .stats {
      background: white;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      box-shadow: 0 1px 5px #ccc;
    }

    .stats h3 {
      margin: 0 0 8px;
      color: #a50000;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding: 7px 0;
      font-size: 14px;
    }

    .empty {
      background: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    @media (min-width: 700px) {
      .stations-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .station {
        margin-bottom: 0;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>VÉ SỐ PHÁT ĐẠT</h1>
  <p>SOI CẦU XSMN</p>
</header>

<div class="tabs">
  <button class="active" onclick="changeRegion('mn', this)">
    MIỀN NAM
  </button>

  <button onclick="changeRegion('mt', this)">
    MIỀN TRUNG
  </button>

  <button onclick="changeRegion('mb', this)">
    MIỀN BẮC
  </button>
</div>

<div class="container">

  <div id="listView">

    <div class="topbar">
      <div class="title" id="regionTitle">
        XỔ SỐ MIỀN NAM
      </div>

      <button class="update" onclick="updateData()">
        CẬP NHẬT
      </button>
    </div>

    <div class="status" id="status">
      Đang tải dữ liệu...
    </div>

    <div id="stations" class="stations-grid">
      <div class="loading">
        Đang tải kết quả...
      </div>
    </div>

  </div>

  <div id="detailView" class="detail">

    <button class="back" onclick="showList()">
      ← QUAY LẠI
    </button>

    <div id="detailContent"></div>

  </div>

</div>

<script>

let currentRegion = "mn";

const regionNames = {
  mn: "XỔ SỐ MIỀN NAM",
  mt: "XỔ SỐ MIỀN TRUNG",
  mb: "XỔ SỐ MIỀN BẮC"
};

function escapeHtml(text) {
  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatValue(value) {
  return escapeHtml(value || "");
}

function changeRegion(region, button) {

  currentRegion = region;

  document.querySelectorAll(".tabs button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  document.getElementById("regionTitle").textContent =
    regionNames[region];

  showList();

  loadResults();
}

async function loadResults() {

  const box = document.getElementById("stations");

  box.innerHTML =
    '<div class="loading">Đang tải kết quả...</div>';

  try {

    const response =
      await fetch(`/api/results?region=${currentRegion}`);

    const data = await response.json();

    const results = data.results || [];

    document.getElementById("status").textContent =
      results.length
        ? `Có ${results.length} đài • Cập nhật ${formatTime(data.updatedAt)}`
        : "Chưa có dữ liệu.";

    if (!results.length) {

      box.innerHTML =
        '<div class="empty">Chưa có dữ liệu kết quả.</div>';

      return;
    }

    box.innerHTML =
      results.map((item, index) =>
        stationCard(item, index)
      ).join("");

  } catch (error) {

    console.error(error);

    box.innerHTML =
      '<div class="empty">Không tải được dữ liệu.</div>';

    document.getElementById("status").textContent =
      "Lỗi kết nối dữ liệu.";
  }
}

function stationCard(item, index) {

  const rows = item.rows || [];

  return `
    <div class="station">

      <div class="station-head">

        <div class="station-name">
          ${escapeHtml(item.station)}
        </div>

        <div class="station-date">
          ${escapeHtml(item.weekday || "")}
          ${item.weekday && item.displayDate ? " • " : ""}
          ${escapeHtml(item.displayDate || "")}
        </div>

      </div>

      <table>

        <tbody>

          ${rows.map(row => {

            const special =
              row.label === "ĐB";

            return `
              <tr class="${special ? "special" : ""}">

                <td>
                  ${escapeHtml(row.label)}
                </td>

                <td>
                  ${formatValue(row.value)}
                </td>

              </tr>
            `;

          }).join("")}

        </tbody>

      </table>

      <button
        class="view"
        onclick="viewStation(${index})">

        XEM TỪNG ĐÀI ›

      </button>

    </div>
  `;
}

let currentResults = [];

async function viewStation(index) {

  try {

    const response =
      await fetch(`/api/results?region=${currentRegion}`);

    const data = await response.json();

    currentResults = data.results || [];

    const item = currentResults[index];

    if (!item) return;

    let analysis = null;

    try {

      const a =
        await fetch(
          `/api/station?region=${currentRegion}&station=${encodeURIComponent(item.station)}`
        );

      if (a.ok) {
        analysis = await a.json();
      }

    } catch (e) {}

    showDetail(item, analysis);

  } catch (error) {

    alert("Không tải được dữ liệu đài.");

  }
}

function showDetail(item, data) {

  document.getElementById("listView").style.display =
    "none";

  document.getElementById("detailView").style.display =
    "block";

  const analysis =
    data && data.analysis
      ? data.analysis
      : null;

  document.getElementById("detailContent").innerHTML = `

    <div class="detail-title">

      <h2>
        ${escapeHtml(item.station)}
      </h2>

      <p>
        ${escapeHtml(item.weekday || "")}
        ${item.weekday && item.displayDate ? " • " : ""}
        ${escapeHtml(item.displayDate || "")}
      </p>

    </div>

    <div class="station">

      <table>

        <tbody>

          ${(item.rows || []).map(row => {

            const special =
              row.label === "ĐB";

            return `
              <tr class="${special ? "special" : ""}">

                <td>
                  ${escapeHtml(row.label)}
                </td>

                <td>
                  ${formatValue(row.value)}
                </td>

              </tr>
            `;

          }).join("")}

        </tbody>

      </table>

    </div>

    ${
      analysis
        ? `
          <div class="stats">

            <h3>
              THỐNG KÊ ${escapeHtml(item.station)}
            </h3>

            <div class="stat-row">
              <span>Ngày thống kê</span>
              <b>${escapeHtml(analysis.date || "")}</b>
            </div>

            <div class="stat-row">
              <span>Tổng số điểm</span>
              <b>${analysis.totalPoint || 0}</b>
            </div>

            <div class="stat-row">
              <span>Đầu xuất hiện</span>
              <b>${formatCounts(analysis.head)}</b>
            </div>

            <div class="stat-row">
              <span>Đuôi xuất hiện</span>
              <b>${formatCounts(analysis.tail)}</b>
            </div>

          </div>
        `
        : ""
    }

  `;
}

function formatCounts(obj) {

  if (!obj) return "";

  return Object.entries(obj)
    .sort((a, b) => b[1] - a[1])
    .map(([key, value]) => `${key}: ${value}`)
    .join(" • ");
}

function showList() {

  document.getElementById("detailView").style.display =
    "none";

  document.getElementById("listView").style.display =
    "block";
}

async function updateData() {

  const status =
    document.getElementById("status");

  status.textContent =
    "Đang cập nhật dữ liệu...";

  try {

    const response =
      await fetch("/api/update", {
        method: "POST"
      });

    const data =
      await response.json();

    if (data.ok) {

      status.textContent =
        "Đã cập nhật dữ liệu thành công.";

      await loadResults();

    } else {

      status.textContent =
        "Cập nhật không thành công.";
    }

  } catch (error) {

    status.textContent =
      "Lỗi khi cập nhật dữ liệu.";
  }
}

function formatTime(value) {

  if (!value) return "";

  const date = new Date(value);

  if (isNaN(date.getTime())) return "";

  return date.toLocaleTimeString("vi-VN", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

loadResults();

</script>

</body>
</html>
