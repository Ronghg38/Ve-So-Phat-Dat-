<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vé Số Phát Đạt - Soi Cầu XSMN</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#fff8e8;color:#222}
    header{background:#b40000;color:#ffd700;text-align:center;padding:20px}
    h1{margin:0;font-size:25px}
    .box{max-width:900px;margin:20px auto;padding:15px}
    button{background:#b40000;color:white;border:0;padding:12px 20px;border-radius:8px}
    table{width:100%;border-collapse:collapse;margin-top:15px;background:white}
    th,td{border:1px solid #ddd;padding:8px}
    th{background:#b40000;color:white}
    .card{background:white;padding:15px;margin-top:15px;border-radius:10px}
  </style>
</head>
<body>

<header>
  <h1>🎯 VÉ SỐ PHÁT ĐẠT</h1>
  <div>Soi Cầu XSMN - Thống Kê Tham Khảo</div>
</header>

<div class="box">
  <div class="card">
    <h2>📊 Dữ liệu XSMN</h2>
    <p id="status">Đang tải dữ liệu...</p>
    <button onclick="updateData()">🔄 Cập nhật dữ liệu</button>
  </div>

  <div class="card">
    <h2>📈 Thống kê</h2>
    <p id="analysis">Đang phân tích...</p>
  </div>

  <div class="card">
    <h2>📋 Kết quả gần nhất</h2>
    <div id="results">Đang tải...</div>
  </div>
</div>

<script>
async function loadData(){
  try{
    const s=await fetch('/api/status').then(r=>r.json());
    document.getElementById('status').innerHTML=
      'Cập nhật gần nhất: '+(s.updatedAt||'Chưa có')+
      '<br>Số ngày dữ liệu: '+s.totalDays;

    const a=await fetch('/api/analyze').then(r=>r.json());
    document.getElementById('analysis').textContent=a.message;

    const data=await fetch('/api/results').then(r=>r.json());

    if(!data.length){
      document.getElementById('results').textContent='Chưa có dữ liệu.';
      return;
    }

    let html='<table><tr><th>Thời gian</th><th>Dữ liệu</th></tr>';

    data.slice(0,10).forEach(x=>{
      html+='<tr><td>'+new Date(x.updatedAt).toLocaleString('vi-VN')+
        '</td><td>'+x.rows.map(r=>r.join(' | ')).join('<br>')+
        '</td></tr>';
    });

    html+='</table>';
    document.getElementById('results').innerHTML=html;
  }catch(e){
    document.getElementById('status').textContent='Chưa kết nối được máy chủ.';
  }
}

async function updateData(){
  document.getElementById('status').textContent='Đang cập nhật...';
  await fetch('/api/update',{method:'POST'});
  loadData();
}

loadData();
setInterval(loadData,60000);
</script>

</body>
</html>
